<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My website</title>
    <link rel="stylesheet" href="style.css">
   
</head>
 <h1>Servatos Apparel</h1>
<body>
   
    <header>
        <nav>
          
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#collection">Collection</a></li>
                <li><a href="#contact">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2 class="about">About Apparel</h2>
            <p>Collection of style made with creativity and love.
            </p>
        </section>

        <section id="collection">
            <h2 class="collection">Featured Collection</h2>
            
            <h3>Classic Hoodie</h3>
          <p>Price: Php <span class="base-price">200</span></p>
         
          <h3>Classic Pants</h3>
          <p>Price: Php <span class="base-price">250</span></p>

          <h3>Classic Hat</h3>
          <p>Price: Php <span class="base-price">100</span></p>
         
          
        </section>
        


        <section id="contact">
            <h2 class="contact">Ask anything!</h2>
            <form action="#">
                <!-- Name -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <!-- Email -->
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <!-- Message -->
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="5" required></textarea>

                <!-- Submit -->
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
